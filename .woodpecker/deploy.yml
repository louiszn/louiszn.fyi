when:
  - event: push
    branch: main

steps:
  build:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: mysite
      dockerfile: Dockerfile
      dry_run: true
      output: type=oci,dest=mysite.tar
      build_args:
        PUBLIC_DEPLOYMENT_HASH: ${CI_COMMIT_SHA}

  deploy:
    image: alpine:latest

    environment:
      DEPLOY_SSH_KEY:
        from_secret: DEPLOY_SSH_KEY
      DEPLOY_HOST:
        from_secret: DEPLOY_HOST
      DEPLOY_USER:
        from_secret: DEPLOY_USER

    commands:
      - apk add --no-cache openssh-client
      
      - mkdir -p ~/.ssh
      - echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
      - chmod 600 ~/.ssh/id_ed25519
      - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      
      - scp -i ~/.ssh/id_ed25519 mysite.tar "$DEPLOY_USER@$DEPLOY_HOST:/tmp/mysite.tar"
      - scp -i ~/.ssh/id_ed25519 docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:/tmp/docker-compose.yml"
      
      - |
        ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" '
          mkdir -p /srv/mysite &&
          mv /tmp/mysite.tar /srv/mysite/mysite.tar &&
          mv /tmp/docker-compose.yml /srv/mysite/docker-compose.yml &&
          cd /srv/mysite &&
          docker load -i mysite.tar &&
          docker compose up -d &&
          rm mysite.tar
        '